<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SME Assistant Prototype</title>
<style>
:root{--red:#e60000;--dark:#25282b;--grey:#5f6368;--line:#e3e3e3;--bg:#f4f5f7;--card:#fff;--green:#137333;--wa:#075e54}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Tahoma,"Noto Sans Arabic",Arial,sans-serif;color:var(--dark);background:var(--bg);font-size:14px;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.ar{direction:rtl;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
/* top bar */
.top{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.logo i{width:20px;height:20px;border-radius:50%;background:var(--red);display:block}
.logo small{font-weight:400;color:var(--grey);font-size:12px}
.seg{display:flex;background:#eef0f2;border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--grey);font-weight:600;white-space:nowrap}
.seg button.on{background:#fff;color:var(--dark);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sp{flex:1}
.pill{font-size:12px;font-weight:600;padding:5px 11px;border-radius:14px;white-space:nowrap;cursor:pointer}
.pill.live{background:#e6f4ea;color:var(--green)}.pill.off{background:#fff4e5;color:#b06000}
.btn{border:1px solid #dadce0;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;color:#3c4043;background:#fff;white-space:nowrap}
.btn:hover{background:#f6f6f6}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:#c90000}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
/* layout */
.cols{height:calc(100vh - 54px);display:grid;grid-template-columns:380px 300px minmax(0,1fr);gap:14px;padding:12px 14px}
.cols.nobrain{grid-template-columns:380px minmax(0,1fr)}
.cols.nobrain #brainCol{display:none}
.col{min-height:0;display:flex;flex-direction:column}
.ct{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--red);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:7px;flex:0 0 auto}
.ct b{background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:0}
.ct .x{margin-left:auto;color:var(--grey);font-weight:600;text-transform:none;letter-spacing:0;font-size:11.5px}
/* customer column */
.ctrl{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--grey);flex-wrap:wrap}
.chipb{background:#fff;border:1px solid #dadce0;border-radius:12px;padding:3px 10px;font-size:12px;color:var(--grey)}
.chipb.on{border-color:var(--dark);color:var(--dark);font-weight:600}
.phone{flex:1;min-height:0;width:340px;margin:0 auto;border-radius:36px;background:#111;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex}
.scr{flex:1;border-radius:27px;overflow:hidden;background:#efe7dc;display:flex;flex-direction:column;min-height:0;position:relative}
.wa{background:var(--wa);color:#fff;padding:18px 12px 9px;display:flex;align-items:center;gap:9px;flex:0 0 auto}
.av{width:34px;height:34px;border-radius:50%;background:#f4c27a;display:flex;align-items:center;justify-content:center;font-weight:700;color:#7a4b00;font-size:13px;flex:0 0 auto}
.wa .n{font-weight:600;font-size:14.5px}.wa .s{font-size:11px;opacity:.8}
.wa .ic{margin-left:auto;font-size:17px}
.msgs{flex:1;overflow-y:auto;padding:10px 9px;display:flex;flex-direction:column;gap:6px;direction:rtl}
.m{max-width:84%;padding:5px 9px 3px;border-radius:9px;font-size:13.5px;line-height:1.55;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap;word-wrap:break-word}
.m small{display:block;text-align:left;direction:ltr;font-size:10px;color:#667781;margin-top:1px}
.m .who{display:block;font-size:10.5px;font-weight:700;color:#b06000;direction:ltr;text-align:right}
.m.me{background:#d9fdd3;align-self:flex-start}
.m.bz{background:#fff;align-self:flex-end}
.m.staff{background:#fff;align-self:flex-end;border-right:4px solid #f5a623}
.m.conf{background:#fff;align-self:flex-end;border-right:4px solid #25d366}
.m.sys{align-self:center;background:#e1f2fb;color:#3c4043;font-size:11.5px;direction:ltr;text-align:center;max-width:92%}
.typing{align-self:flex-end;background:#fff;border-radius:9px;padding:8px 12px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa0a6;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.inp{display:flex;align-items:flex-end;gap:7px;padding:7px;flex:0 0 auto}
.inp textarea{overflow:hidden;flex:1;border:0;border-radius:20px;min-height:38px;max-height:90px;padding:9px 14px;resize:none;outline:none;direction:rtl;font-size:13.5px}
.round{width:38px;height:38px;border-radius:50%;background:#00a884;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.round.rec{background:var(--red);animation:pu 1s infinite}
@keyframes pu{50%{box-shadow:0 0 0 6px rgba(230,0,0,.25)}}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;justify-content:center;flex:0 0 auto}
.chips button{font-size:11.5px;background:#fff;border:1px dashed #b9bcc0;border-radius:12px;padding:3px 9px;color:#3c4043}
.chips button:hover{border-color:var(--dark)}
.chips .lbl{font-size:11px;color:var(--grey);width:100%;text-align:center}
/* call screen */
.call{background:linear-gradient(180deg,#1f2a2e,#0f1416);color:#fff}
.ch{text-align:center;padding:28px 0 8px;flex:0 0 auto}
.bigav{width:66px;height:66px;border-radius:50%;background:#f4c27a;color:#7a4b00;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.cn{font-size:19px;font-weight:600}.cs{font-size:12.5px;opacity:.75;margin-top:2px}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:28px;margin-top:10px}
.wave i{width:4px;height:6px;border-radius:2px;background:#5f6368;display:block;transition:height .12s}
.wave.on i{background:#25d366}
.spk{font-size:11.5px;color:#7ee2a8;margin-top:4px;min-height:16px}
.cap{flex:1;min-height:0;margin:4px 10px;background:rgba(255,255,255,.07);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;direction:rtl;overflow-y:auto}
.capt{direction:ltr;font-size:10px;letter-spacing:.08em;opacity:.55}
.l{font-size:13px;line-height:1.5;opacity:.9}
.l b{font-size:10.5px;display:block;opacity:.75;font-weight:600;direction:ltr;text-align:right}
.l.c b{color:#9fd4ff}.l.a b{color:#7ee2a8}
.l.last{opacity:1;background:rgba(37,211,102,.14);border-radius:8px;padding:3px 7px}
.ctl{display:flex;justify-content:space-around;padding:10px 20px 18px;flex:0 0 auto}
.ctl button{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;color:#fff}
.ctl small{font-size:9px;opacity:.75;margin-top:1px}
.ctl .end{background:#e53935}.ctl .go{background:#25d366}
.ctl button.act{background:#fff;color:#111}
.dial{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:20px}
.dial .num{font-size:13px;opacity:.7}
.dial .hint{font-size:12px;opacity:.6;max-width:240px;line-height:1.5}
.bigcall{width:68px;height:68px;border-radius:50%;background:#25d366;font-size:28px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 0 rgba(37,211,102,.5);animation:pu2 2s infinite}
@keyframes pu2{70%{box-shadow:0 0 0 14px rgba(37,211,102,0)}}
.after{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.5;flex:0 0 auto}
/* brain column */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.small{font-size:11.5px;color:var(--grey)}
.src{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.src div{display:flex;justify-content:space-between;font-size:12.5px;background:#f4f4f4;border-radius:7px;padding:5px 9px}
.logcard{margin-top:10px;flex:1;min-height:0;display:flex;flex-direction:column}
.log{flex:1;overflow-y:auto;margin-top:8px}
.st{display:flex;gap:9px;font-size:12.5px;line-height:1.4;padding-bottom:10px;position:relative;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(4px)}}
.st:before{content:'';position:absolute;left:10px;top:22px;bottom:0;width:2px;background:#ececec}
.st:last-child:before{display:none}
.st i{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:#fff;z-index:1}
.st .t{color:var(--grey);font-size:11px;word-break:break-word}
code{font-family:Consolas,ui-monospace,monospace;font-size:11.5px;background:#fdecec;color:#c00000;padding:1px 4px;border-radius:4px}
/* owner column */
.tabs{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap;flex:0 0 auto}
.tabs button{font-size:13px;font-weight:600;color:var(--grey);padding:6px 12px;border-radius:8px;position:relative}
.tabs button.on{background:var(--dark);color:#fff}
.tabs button .dot{position:absolute;top:2px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.pane{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.kp b{display:block;font-size:23px;color:var(--red);line-height:1.2}
.kp span{font-size:11.5px;color:var(--grey)}
.kp .bump b{animation:bump .8s}
@keyframes bump{30%{transform:scale(1.25)}}
.ord{margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px}
.ord.new{border:2px solid var(--red);animation:glow 1.4s 2}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(230,0,0,.18)}}
.ord .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap}
.tag.new{background:var(--red);color:#fff}.tag.prep{background:#e8f0fe;color:#1a56c4}.tag.out{background:#fff4e5;color:#b06000}.tag.done{background:#e6f4ea;color:var(--green)}
.lines{font-size:13px;margin:7px 0;display:grid;grid-template-columns:1fr auto;row-gap:2px}
.acc{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.alert{margin-top:10px;background:#fff4e5;border:1px solid #f5c26b;border-radius:12px;padding:9px 13px;font-size:12.5px;display:flex;gap:10px;align-items:center}
.alert b{color:#b06000}
.list{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 104px minmax(0,1fr) 104px;align-items:center;gap:6px;padding:7px 12px;border-top:1px solid #f0f0f0;font-size:12.5px}
.row.hd{border-top:0;font-size:11px;color:var(--grey);font-weight:600;background:#fafafa}
.row.click{cursor:pointer}.row.click:hover{background:#fafafa}
.row .cv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;text-align:center;white-space:nowrap}
.g{background:#e6f4ea;color:var(--green)}.b{background:#e8f0fe;color:#1a56c4}.o{background:#fff4e5;color:#b06000}.r{background:#fdecec;color:#c00000}
.sec{font-size:13px;font-weight:700;margin:14px 0 6px}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
table.t th{background:#fafafa;color:var(--grey);font-size:11px;text-align:left;padding:7px 9px;font-weight:600}
table.t td{border-top:1px solid #f0f0f0;padding:6px 9px;vertical-align:middle}
table.t input{width:68px;border:1px solid #dadce0;border-radius:6px;padding:3px 6px;text-align:right}
table.t input.w{width:100%;text-align:left}
.field{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px}
.field input,.field textarea{border:1px solid #dadce0;border-radius:7px;padding:5px 8px;width:100%}
.note{font-size:11.5px;color:var(--grey);background:#f1f3f4;border-radius:8px;padding:7px 10px;margin:8px 0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:5px}
.slot{font-size:12px;border-radius:7px;padding:5px;text-align:center;border:1px solid var(--line);background:#fff}
.slot.booked{background:#f1f3f4;color:#9aa0a6;text-decoration:line-through}
.slot.past{background:#fafafa;color:#c4c7c5}
.slot.live{background:var(--red);color:#fff;border-color:var(--red);font-weight:600;text-decoration:none}
.slot.free{border-color:#a8dab5;color:var(--green)}
.days{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.radio{display:flex;flex-direction:column;gap:6px;font-size:13px}
.radio label{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer}
.radio label.on{border-color:var(--dark)}
/* report */
.rep{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rep .hd2{padding:13px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start}
.rep .k1{font-size:11.5px;font-weight:600;color:var(--grey);letter-spacing:.04em;text-transform:uppercase}
.rep .k2{font-size:18px;font-weight:700}
.rep .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 8px}
.rep .k{border-radius:10px;background:#f4f4f4;padding:8px 11px}
.rep .k b{display:block;font-size:22px;color:var(--red)}.rep .k span{font-size:12px;color:#3c4043}
.bars{display:flex;align-items:flex-end;gap:8px;height:70px;padding:0 16px}
.bars div{flex:1;background:var(--red);border-radius:4px 4px 0 0;position:relative}
.bars div span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--grey)}
.rep .foot{background:var(--dark);color:#fff;padding:10px 16px;font-size:13px;margin-top:26px}
.rep .foot b{color:#ff8a8a}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.box{background:#fff;border-radius:14px;width:560px;max-width:94vw;max-height:90vh;overflow-y:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.box h3{font-size:17px;margin-bottom:4px}
.box .x2{float:right;font-size:20px;color:var(--grey)}
.box label.f{display:block;font-size:12.5px;font-weight:600;margin:12px 0 4px}
.box input[type=password],.box input[type=text],.box select{width:100%;border:1px solid #dadce0;border-radius:8px;padding:7px 10px}
.okmsg{font-size:12.5px;margin-top:8px;padding:7px 10px;border-radius:8px}
.okmsg.ok{background:#e6f4ea;color:var(--green)}.okmsg.bad{background:#fdecec;color:#c00000}
.drawer .tr{max-height:46vh;overflow-y:auto;background:#efe7dc;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;direction:rtl}
.wapre{background:#efe7dc;border-radius:12px;padding:12px;direction:rtl}
.wapre .m{max-width:100%}
/* toast */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center}
.toast{background:var(--dark);color:#fff;font-size:13px;padding:8px 14px;border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:fi .25s;max-width:560px}
.toast.warn{background:#b06000}
.howgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:12.5px;line-height:1.5}
.howgrid div{background:#f6f6f6;border-radius:10px;padding:10px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.flow span{background:#fdecec;color:#c00000;border-radius:8px;padding:5px 8px;font-weight:600}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%}body{overflow:visible;background:#fff}}
@media (max-width:1300px){.cols{grid-template-columns:350px 260px minmax(0,1fr)}.phone{width:320px}.cols.nobrain{grid-template-columns:350px minmax(0,1fr)}}

@media (max-width:1500px){.logo small{display:none}.top{gap:9px;padding:0 12px}.btn{padding:6px 9px}}
@media (max-width:1250px){.cols{grid-template-columns:330px 250px minmax(0,1fr);gap:10px;padding:10px}.cols.nobrain{grid-template-columns:340px minmax(0,1fr)}.phone{width:310px}.top .btn{font-size:12px}#btnHow{display:none}}
@media (max-width:900px){body{overflow:auto}.top{overflow-x:auto;white-space:nowrap;scrollbar-width:none}.top::-webkit-scrollbar{display:none}.cols,.cols.nobrain{height:auto;grid-template-columns:minmax(0,1fr);gap:16px;padding:10px}#custCol{height:700px}#brainCol{height:560px}#ownerCol{min-height:640px}.phone{width:min(340px,100%)}.kp{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:44px 84px minmax(0,1fr)}.row>:nth-child(4){grid-column:2/-1}.field{grid-template-columns:1fr}.howgrid,.rep .grid{grid-template-columns:1fr}}

</style></head><body>
<header class="top">
  <div class="logo"><i></i>SME Assistant <small>prototype · built on the Gemini API</small></div>
  <div class="seg" id="bizSeg">
    <button data-biz="restaurant">🍽 Zaatar Kitchen</button>
    <button data-biz="clinic">🩺 Dr. Ahmed Clinic</button>
  </div>
  <div class="sp"></div>
  <span id="modePill" class="pill"></span>
  <button class="btn" id="btnBrain">Hide middle panel</button>
  <button class="btn" id="btnHow">How it works</button>
  <button class="btn" id="btnSettings">⚙ Settings</button>
  <button class="btn" id="btnReset">↺ Reset demo</button>
</header>
<main class="cols" id="cols">
  <section class="col" id="custCol"></section>
  <section class="col" id="brainCol"></section>
  <section class="col" id="ownerCol"></section>
</main>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div id="toasts"></div>
<div id="printArea"></div>

<script>
// ===================================================================
// DATA: approved information for the two example businesses
// ===================================================================
const DEFAULT_INFO = {
  restaurant: {
    name: 'Zaatar Kitchen',
    nameAr: 'زعتر كيتشن',
    type: 'Egyptian restaurant with its own delivery',
    branch: 'Abbas El Akkad St., Nasr City',
    hours: 'Every day, 12:00 PM to 2:00 AM',
    payment: 'Cash on delivery (payment links come in Phase 2)',
    deliveryTime: 45,
    minOrder: 100,
    menu: [
      { id: 'koshary', ar: 'كشري', en: 'Koshary', cat: 'Main', sizes: { 'صغير': 45, 'وسط': 65, 'كبير': 85 } },
      { id: 'koshary_special', ar: 'كشري سبيشيال باللحمة', en: 'Special koshary with meat', cat: 'Main', sizes: { 'عادي': 120 } },
      { id: 'hawawshi', ar: 'حواوشي', en: 'Hawawshi', cat: 'Main', sizes: { 'عادي': 90 } },
      { id: 'mahshi', ar: 'محشي مشكل', en: 'Mixed mahshi', cat: 'Main', sizes: { 'عادي': 110 } },
      { id: 'molokhia', ar: 'ملوخية بالفراخ', en: 'Molokhia with chicken', cat: 'Main', sizes: { 'عادي': 160 } },
      { id: 'foul', ar: 'ساندوتش فول', en: 'Foul sandwich', cat: 'Sandwiches', sizes: { 'عادي': 15 } },
      { id: 'taameya', ar: 'ساندوتش طعمية', en: 'Taameya sandwich', cat: 'Sandwiches', sizes: { 'عادي': 15 } },
      { id: 'liver', ar: 'ساندوتش كبدة', en: 'Liver sandwich', cat: 'Sandwiches', sizes: { 'عادي': 45 } },

const AR_DIG = '٠١٢٣٤٥٦٧٨٩';
const toLatin = (s) => String(s ?? '').replace(/[٠-٩]/g, (d) => AR_DIG.indexOf(d));
const toAr = (s) => String(s).replace(/[0-9]/g, (d) => AR_DIG[d]);
const normAr = (s) => toLatin(s).toLowerCase()
  .replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
  .replace(/[؟?!.,،:]/g, ' ').replace(/\s+/g, ' ').trim();
const DAYS_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DAYS_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const pad = (n) => String(n).padStart(2, '0');
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function dayInfo(offset) {
  const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + offset);
  return { iso: isoOf(d), dow: d.getDay(), en: `${DAYS_EN[d.getDay()]} ${d.getDate()} ${MONTHS_EN[d.getMonth()]}`, ar: DAYS_AR[d.getDay()], date: d };
}
function parseIso(iso) { const [y, m, d] = iso.split('-').map(Number); const x = new Date(y, m - 1, d, 12); return x; }
function time12(hhmm) { let [h, m] = hhmm.split(':').map(Number); const pm = h >= 12; const h12 = ((h + 11) % 12) + 1; return `${h12}:${pad(m)} ${pm ? 'PM' : 'AM'}`; }
function nowHHMM() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); }

// ------------------------------------------------------------- menu & areas
const SIZE_SYN = { 'كبير': 'كبير', 'large': 'كبير', 'big': 'كبير', 'وسط': 'وسط', 'متوسط': 'وسط', 'medium': 'وسط', 'صغير': 'صغير', 'small': 'صغير', 'عادي': 'عادي', 'regular': 'عادي' };
function findMenuItem(name) {
  const q = normAr(name); if (!q) return null;
  const menu = S.info.restaurant.menu;
  let best = null, bestScore = 0;
  for (const it of menu) {
    const a = normAr(it.ar), e = it.en.toLowerCase();
    let sc = 0;
    if (q === a || q === e) sc = 100;
    else if (q.includes(a)) sc = 50 + a.length;
    else if (a.includes(q)) sc = 40 - (a.length - q.length) / 10;
    else if (q.includes(e) || e.includes(q)) sc = 30;
    else {
      const qw = q.split(' ').filter((w) => w.length > 2); const aw = a.split(' ');
      const hits = qw.filter((w) => aw.includes(w) || aw.some((x) => x.includes(w) || w.includes(x))).length;
      if (hits) sc = 10 + hits;
    }
    if (sc > bestScore) { bestScore = sc; best = it; }
  }
  return best;
}
function findArea(area) {
  const q = normAr(area); if (!q) return null;
  return S.info.restaurant.areas.find((a) => q.includes(normAr(a.ar)) || normAr(a.ar).includes(q) || q.includes(a.en.toLowerCase()) || (normAr(a.ar).includes('التجمع') && q.includes('تجمع'))) || null;
}
function priceOrder(items, area, pickup) {
  const R = S.info.restaurant; const lines = []; const problems = [];
  for (const raw of items || []) {
    const it = findMenuItem(raw.item || raw.name || '');
    const qty = Math.max(1, parseInt(toLatin(raw.quantity ?? raw.qty ?? 1), 10) || 1);
    if (!it) { problems.push(`"${raw.item}" is not on the menu`); continue; }
    const sizes = Object.keys(it.sizes);
    let size = sizes.length === 1 ? sizes[0] : null;
    if (!size && raw.size) { const s = SIZE_SYN[normAr(raw.size)] || SIZE_SYN[String(raw.size).toLowerCase()] || normAr(raw.size); size = sizes.find((x) => normAr(x) === normAr(s)) || null; }
    if (!size) { problems.push(`size needed for ${it.ar}: ${sizes.map((s) => `${s} ${it.sizes[s]} EGP`).join(', ')}`); continue; }
    const unit = Number(it.sizes[size]);
    lines.push({ item: it.ar, en: it.en, size, qty, unit, total: unit * qty });
  }
  const subtotal = lines.reduce((a, l) => a + l.total, 0);
  let fee = 0, areaObj = null, eta = R.deliveryTime;
  if (!pickup && area) {
    areaObj = findArea(area);
    if (!areaObj) problems.push(`no delivery to "${area}". Delivery areas: ${R.areas.map((a) => a.ar).join('، ')}`);
    else { fee = Number(areaObj.fee); eta = areaObj.minutes; }
  }
  if (subtotal && subtotal < R.minOrder && !pickup) problems.push(`minimum order for delivery is ${R.minOrder} EGP`);
  return { lines, subtotal, fee, total: subtotal + fee, area: areaObj, eta, problems };
}

// ------------------------------------------------------------- clinic slots
function findDoctor(q) {
  const docs = S.info.clinic.doctors; const n = normAr(q || '');
  return docs.find((d) => n.includes(d.id) || n.includes(normAr(d.ar).replace('د ', '').split(' ')[0]) || normAr(d.ar).includes(n) && n.length > 2 || n.includes(normAr(d.spec)) || d.en.toLowerCase().includes(n) && n.length > 2 || n.includes(d.specEn.toLowerCase())) || null;
}
function clinicSlots(doc, iso) {
  const C = S.info.clinic; const d = parseIso(iso); const out = [];
  if (!doc.days.includes(d.getDay())) return null;
  const todayIso = dayInfo(0).iso; const now = nowHHMM();
  for (let m = doc.from * 60; m < doc.to * 60; m += C.slotMinutes) {
    const t = `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
    const live = S.bookings.find((b) => b.doctorId === doc.id && b.date === iso && b.time === t);
    const seeded = !live && !['19:00', '13:00'].includes(t) && (hash(doc.id + iso + t) % 10) < 5;
    const past = iso === todayIso && t <= now;
    out.push({ time: t, status: live ? 'live' : seeded ? 'booked' : past ? 'past' : 'free', booking: live });
  }
  return out;
}
function parseDateArg(x) {
  const s = normAr(x || '');
  if (/^\d{4}-\d{2}-\d{2}$/.test(toLatin(x || '').trim())) return toLatin(x).trim();
  if (s.includes('بعد بكره')) return dayInfo(2).iso;
  if (s.includes('بكره') || s.includes('tomorrow')) return dayInfo(1).iso;
  if (s.includes('النهارده') || s.includes('today')) return dayInfo(0).iso;
  for (let i = 0; i < 8; i++) { const di = dayInfo(i); if (s.includes(normAr(di.ar).replace('ال', '')) || s.includes(DAYS_EN[di.dow].toLowerCase())) return di.iso; }
  return null;
}

// ------------------------------------------------------------- tool execution
function execTool(conv, name, args) {
  const biz = conv.biz; const R = S.info.restaurant; const C = S.info.clinic;
  try {
    if (name === 'quote_order') {
      const q = priceOrder(args.items, args.area, args.pickup);
      log('tool', `Tool <code>quote_order</code> → EGP ${q.subtotal}${q.fee ? ` + ${q.fee} delivery` : ''}`, q.problems.length ? '⚠ ' + q.problems.join('; ') : "price from the owner's menu, not from the AI");
      return { ok: q.problems.length === 0, lines: q.lines.map((l) => `${l.qty} × ${l.item} ${l.size !== 'عادي' ? l.size : ''} = ${l.total} EGP`), subtotal: q.subtotal, delivery_fee: q.fee, total: q.total, delivery_area: q.area?.ar || null, delivery_minutes: q.eta, problems: q.problems };
    }
    if (name === 'place_order') {
      const q = priceOrder(args.items, args.area, args.pickup);
      if (q.problems.length || !q.lines.length) { log('tool', 'Tool <code>place_order</code> → not saved', '⚠ ' + q.problems.join('; ')); return { ok: false, problems: q.problems }; }
      if (!args.pickup && !args.address && !args.area) return { ok: false, problems: ['delivery address needed'] };
      const o = { id: S.nextOrder++, biz, convId: conv.id, customer: args.customer_name || conv.customer.name, phone: conv.customer.phone, channel: conv.channel, lines: q.lines, subtotal: q.subtotal, fee: q.fee, total: q.total, area: q.area?.en || (args.pickup ? 'Pick-up' : ''), address: args.pickup ? 'Pick-up at branch' : (args.address || ''), notes: args.notes || '', status: 'new', time: new Date(), eta: q.eta };
      S.orders.unshift(o); conv.status = 'order'; conv.result = `Order #${o.id}: ${o.lines.map((l) => `${l.qty} ${l.en}`).join(', ')}`;
      log('tool', `Tool <code>place_order</code> → order #${o.id} saved`, "sent to the owner's dashboard"); flashOwner('order', o.id);
      if (conv.channel === 'call') queueConfirmation(conv, `✅ ${R.nameAr}: تم تأكيد طلبك رقم ${toAr(o.id)}\nالإجمالي ${toAr(o.total)} جنيه · التوصيل خلال ${toAr(o.eta)} دقيقة · الدفع كاش عند الاستلام`);
      return { ok: true, order_number: o.id, total: o.total, delivery_minutes: o.eta, payment: R.payment };
    }
    if (name === 'check_free_slots') {
      const doc = findDoctor(args.doctor) || C.doctors[0]; const iso = parseDateArg(args.date) || dayInfo(1).iso;
      const slots = clinicSlots(doc, iso); const di = parseIso(iso);
      if (!slots) { const days = doc.days.map((d) => DAYS_AR[d]).join('، '); log('tool', `Tool <code>check_free_slots</code> → ${doc.en} not working that day`, `works: ${doc.days.map((d) => DAYS_EN[d]).join(', ')}`); return { ok: false, doctor: doc.ar, date: iso, reason: `${doc.ar} does not work on ${DAYS_AR[di.getDay()]}. Working days: ${days}` }; }
      const free = slots.filter((s) => s.status === 'free').map((s) => s.time);
      log('tool', `Tool <code>check_free_slots</code> → ${free.length} free on ${DAYS_EN[di.getDay()]}`, `${doc.en}: ${free.slice(0, 4).map(time12).join(', ')}${free.length > 4 ? '…' : ''}`);
      return { ok: true, doctor: doc.ar, doctor_id: doc.id, date: iso, day: DAYS_AR[di.getDay()], free_times_24h: free, fee_new: doc.fee, fee_follow_up: doc.followup };
    }
    if (name === 'book_appointment') {
      const doc = findDoctor(args.doctor) || C.doctors[0]; const iso = parseDateArg(args.date); const t = toLatin(args.time || '').trim().padStart(5, '0');
      const slots = iso && clinicSlots(doc, iso); const slot = slots && slots.find((s) => s.time === t);
      if (!slot || slot.status !== 'free') { log('tool', 'Tool <code>book_appointment</code> → slot not free', `${doc.en} ${iso} ${t}: taken or not available`); return { ok: false, problem: 'This time is not free. Call check_free_slots again and offer other times.' }; }
      const ft = (args.visit_type || '').includes('follow') ? 'follow-up' : 'new';
      const b = { id: S.nextBooking++, biz, convId: conv.id, doctorId: doc.id, doctor: doc.en, doctorAr: doc.ar, date: iso, time: t, patient: args.patient_name || conv.customer.name, phone: conv.customer.phone, channel: conv.channel, type: ft, fee: ft === 'new' ? doc.fee : doc.followup, status: 'new', created: new Date() };
      S.bookings.unshift(b); conv.status = 'booked'; conv.result = `Booked: ${doc.en}, ${DAYS_EN[parseIso(iso).getDay()]} ${time12(t)}`;
      log('tool', `Tool <code>book_appointment</code> → booking saved`, `${doc.en}, ${DAYS_EN[parseIso(iso).getDay()]} ${time12(t)}: slot now taken`); flashOwner('booking', b.id);
      const msg = `✅ ${C.nameAr}: تم تأكيد حجزك\n${doc.ar} · ${DAYS_AR[parseIso(iso).getDay()]} ${toAr(parseIso(iso).getDate())}/${toAr(parseIso(iso).getMonth() + 1)} الساعة ${toAr(time12(t).replace(' PM', ' م').replace(' AM', ' ص'))}\nالكشف ${toAr(b.fee)} جنيه · ${C.branch}`;
      if (conv.channel === 'call') queueConfirmation(conv, msg);
      return { ok: true, booking_number: b.id, doctor: doc.ar, day: DAYS_AR[parseIso(iso).getDay()], date: iso, time: t, fee: b.fee, address: C.branch };
    }
    if (name === 'hand_over_to_staff') {
      conv.status = 'staff_needed'; conv.handover = { reason: args.reason || '', summary: args.summary || '', time: new Date() }; conv.result = args.summary || args.reason;
      log('handover', 'Handed over to staff', args.summary || args.reason || ''); flashOwner('handover', conv.id);
      return { ok: true, instruction: conv.channel === 'call' ? 'Tell the caller a team member will call them back within 15 minutes on this number.' : 'Tell the customer a team member will reply here shortly.' };
    }
    return { ok: false, problem: 'unknown tool' };
  } catch (e) { console.error(e); return { ok: false, problem: String(e.message || e) }; }
}

    return `${doc.ar} يوم ${r.day} متاح الساعة ${pick.join(' أو ')}. تحب أنهي معاد؟`;
  }
  if (o.stage === 'time') {
    const w = t.split(' '); let h = null;
    for (const x of w) { if (/^\d{1,2}$/.test(x)) h = +x; else if (NUM_WORDS[x.replace(/^ال/, '')]) h = NUM_WORDS[x.replace(/^ال/, '')]; }
    if (h !== null) {
      if (h < 12 && (o.doc.from >= 12 || h <= 4)) h += 12;
      const half = t.includes('ونص'); const want = `${pad(h)}:${half ? '30' : '00'}`;
      if (o.free.includes(want)) { o.time = want; o.stage = 'name'; return 'تمام، الحجز باسم مين؟'; }
      return `الساعة ${toAr(time12(want).replace(':00', '').replace(' PM', ''))} محجوزة، متاح ${o.free.slice(0, 3).map((x) => toAr(time12(x).replace(':00', '').replace(' PM', ''))).join(' أو ')}.`;
    }
    return `متاح ${o.free.slice(0, 3).map((x) => toAr(time12(x).replace(':00', '').replace(' PM', ''))).join(' أو ')}، تحب أنهي ساعة؟`;
  }
  if (o.stage === 'name') {
    const name = text.replace(/^(باسم|اسمي|الاسم|انا)\s*/, '').trim() || conv.customer.name;
    const r = execTool(conv, 'book_appointment', { doctor: o.doc.id, date: o.date, time: o.time, patient_name: name });
    conv.off = { stage: null };
    if (!r.ok) return 'المعاد ده لسه اتحجز، تحب أشوفلك معاد تاني؟';
    return `تم الحجز يا ${name} ✅ ${r.doctor} يوم ${r.day} الساعة ${toAr(time12(r.time).replace(':00', '').replace(' PM', ''))} بالليل، الكشف ${toAr(r.fee)} جنيه، والعنوان ${C.branch}.`;
  }
  if (has('شكرا', 'متشكر', 'تسلم', 'ميرسي', 'thanks')) return 'العفو يا فندم، ألف سلامة.';
  if (has('مواعيد', 'امتي', 'موجود', 'بيجي')) return C.doctors.map((d) => `${d.ar} (${d.spec}) أيام ${d.days.map((x) => DAYS_AR[x]).join(' و')} من ${toAr(d.from > 12 ? d.from - 12 : d.from)} لـ${toAr(d.to > 12 ? d.to - 12 : d.to)}`).join('، و') + '. تحب أحجزلك؟';
  if (greet) return 'أهلاً بحضرتك، تحب تحجز كشف ولا عندك استفسار؟';
  o.unk = (o.unk || 0) + 1;
  if (o.unk === 1) return 'معلش يا فندم، ممكن توضحلي أكتر؟ تحب تحجز كشف ولا عندك سؤال عن المواعيد أو الأسعار؟';
  execTool(conv, 'hand_over_to_staff', { reason: 'Offline brain did not understand', summary: `Patient said: "${text}"` });
  return 'ثانية واحدة يا فندم، هخلي حد من العيادة يرد على حضرتك.';
}

function getConv(biz, cust, channel, fresh) {
  let c = !fresh && S.convs.find((x) => x.biz === biz && x.customer.id === cust.id && x.channel === channel && (channel === 'whatsapp' || !x.ended));
  if (!c) { c = { id: 'v' + Math.random().toString(36).slice(2, 8), biz, customer: cust, channel, messages: [], history: [], status: 'open', started: new Date(), lastAt: new Date(), off: null }; S.convs.unshift(c); }
  return c;
}
function setStatusAfterReply(conv) { if (conv.status === 'open') conv.status = 'answered'; }

async function sendCustomer(text) {
  text = (text || '').trim(); if (!text) return;
  if (S.busy) { toast('Wait for the reply first'); return; }
  if (S.channel !== 'whatsapp') { S.channel = 'whatsapp'; }
  const conv = getConv(S.biz, customer(), 'whatsapp');
  conv.messages.push({ from: 'me', text, t: new Date() }); conv.lastAt = new Date();
  log('in', `WhatsApp message from ${conv.customer.name}`, text.length > 70 ? text.slice(0, 70) + '…' : text);
  renderCustomer(); renderOwner();
  if (conv.status === 'staff') { log('owner', 'Staff is handling this chat', 'the assistant stays silent'); return; }
  S.busy = true; renderCustomer();
  let reply;
  try { reply = await assistantTurn(conv, text); } finally { S.busy = false; }
  conv.messages.push({ from: 'bz', text: reply, t: new Date() }); conv.lastAt = new Date(); setStatusAfterReply(conv);
  renderAll();
}

}

  const r2 = await fetch(`${GEMINI}/interactions`, { method: 'POST', headers: H, body: JSON.stringify({ model: o.model, input: [{ type: 'user_input', content: [{ type: 'text', text, annotations: [{ type: 'speech_metadata', style: TTS_STYLE }] }] }], response_format: { type: 'audio', mime_type: 'audio/wav', sample_rate: 24000 }, generation_config: { speech_config: [{ voice: o.voice }] } }) });
  const j2 = await r2.json().catch(() => ({})); const a2 = r2.ok && findAudio(j2); if (a2) return a2;
  throw new Error(j2.error?.message || err || 'no audio returned');
}
async function playB64(ctx, aud) {
  const bin = atob(aud.data); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  let buf;
  if (/wav/i.test(aud.mime) || aud.data.startsWith('UklGR')) buf = await ctx.decodeAudioData(bytes.buffer.slice(0));
  else { const rate = +((/rate=(\d+)/.exec(aud.mime) || [])[1] || 24000); const n = bytes.length >> 1; buf = ctx.createBuffer(1, n, rate); const ch = buf.getChannelData(0); const dv = new DataView(bytes.buffer); for (let i = 0; i < n; i++) ch[i] = dv.getInt16(2 * i, true) / 32768; }
  return new Promise((res) => { const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.onended = res; s.start(); if (S.call) S.call.ttsSrc = s; });
}
function speak(text, done) {
  const call = S.call; if (!call) return;
  if (call.engine === 'tts') {
    const st = S.settings; call.thinking = true;
    geminiSpeech(text.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF✅]/gu, ''), { key: st.apiKey, model: st.ttsModel, voice: st.voice })
      .then((aud) => { call.thinking = false; if (S.call !== call) return; call.tts = true; return playB64(call.outCtx, aud); })
      .then(() => { call.tts = false; if (S.call === call) done && done(); })
      .catch((e) => { call.thinking = false; console.warn(e); log('warn', 'Gemini speech unavailable → Chrome voice for this reply', String(e.message || e).slice(0, 100)); call.engine = 'browser'; renderCaptions(); speak(text, done); });
    return;
  }
  const clean = text.replace(/[\u{1F300}-\u{1FAFF}☀-➿✅]/gu, '');
  let finished = false; const fin = () => { if (finished) return; finished = true; if (S.call === call) { call.tts = false; done && done(); } };
  try {
    const u = new SpeechSynthesisUtterance(clean); const v = arabicVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'ar-EG'; if (!call.warnedVoice) { call.warnedVoice = true; toast('No Arabic voice found in Chrome: captions only', 'warn'); } }
    u.rate = 1.02; u.onend = fin; u.onerror = fin; call.tts = true; speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(fin, 1500 + clean.length * 110); // safety net
  } catch (e) { fin(); }
}
function listen() {
  const call = S.call; if (!call || call.muted || call.ending) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setSpk('Use the shortcuts below (speech needs Chrome)'); return; }
  stopListen();
  const r = callRecog = new SR(); r.lang = 'ar-EG'; r.interimResults = true; r.continuous = false;
  let got = '';
  r.onresult = (e) => {
    let s = ''; for (const x of e.results) s += x[0].transcript; got = s;
    if (call.curC == null) { call.caps.push({ who: 'c', text: '' }); call.curC = call.caps.length - 1; }
    call.caps[call.curC].text = s; renderCaptions();
  };
  r.onerror = (e) => { if (e.error === 'not-allowed') { toast('Microphone blocked: allow it in Chrome, or use the shortcuts', 'warn'); call.noMic = true; } };
  r.onend = () => {
    call.listening = false; if (callRecog === r) callRecog = null;
    if (S.call !== call || call.ending) return;
    if (got.trim()) { call.curC = null; handleUtterance(got.trim(), true); }
    else if (!call.noMic && !call.thinking && !call.tts) setTimeout(listen, 250);
  };
  try { r.start(); call.listening = true; } catch (e) { }
}
function stopListen() { if (callRecog) { const r = callRecog; callRecog = null; try { r.onend = null; r.abort(); } catch (e) { } } if (S.call) S.call.listening = false; }
async function handleUtterance(text, alreadyCaptioned) {
  const call = S.call; if (!call) return;
  stopListen();
  if (!alreadyCaptioned) addCap('c', text);
  call.conv.messages.push({ from: 'me', text, t: new Date() }); call.conv.lastAt = new Date();
  log('in', `${call.conv.customer.name} said (speech recognised)`, text.length > 70 ? text.slice(0, 70) + '…' : text);
  call.thinking = true;
  let reply; try { reply = await assistantTurn(call.conv, text); } finally { call.thinking = false; }
  if (S.call !== call) return;
  addCap('a', reply); call.conv.messages.push({ from: 'bz', text: reply, t: new Date() }); setStatusAfterReply(call.conv);
  renderOwner(); renderBrain();
  speak(reply, () => listen());
}
function callSay(text) {
  const call = S.call; if (!call || call.state !== 'connected') { toast('Wait for the call to connect'); return; }
  if (call.engine === 'live' && call.ws && call.ws.readyState === 1) {
    if (call.curA != null) finishA(call);
    addCap('c', text); call.conv.messages.push({ from: 'me', text, t: new Date() });
    log('in', `${call.conv.customer.name} said (demo shortcut)`, text);
    stopPlayback(call);
    call.ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text }] }], turnComplete: true } }));
    return;
  }
  if (call.thinking) { toast('Wait for the reply first'); return; }
  try { speechSynthesis.cancel(); } catch (e) { } try { call.ttsSrc && call.ttsSrc.stop(); } catch (e) { }
  call.tts = false; handleUtterance(text, false);
}

// ------------------------------------------------------------- voice test (Settings)
async function testVoice(o) {
  const text = greetingFor(S.biz) + (S.biz === 'restaurant' ? ' النهارده عندنا كشري وحواوشي، والتوصيل لمدينة نصر خمسة وعشرين جنيه.' : ' الكشف عند دكتور أحمد بأربعمية جنيه، وفي مواعيد بكرة الساعة سبعة.');
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    if (o.engine === 'browser') { const u = new SpeechSynthesisUtterance(text); const vv = arabicVoice(); if (vv) { u.voice = vv; u.lang = vv.lang; } else toast('No Arabic voice installed in Chrome', 'warn'); speechSynthesis.speak(u); return; }
    if (!o.key) { toast('Connect your key first', 'warn'); return; }
    if (o.engine === 'tts') { toast('Generating the voice…'); const a = await geminiSpeech(text, { key: o.key, model: o.tts, voice: o.voice }); await playB64(ctx, a); return; }
    // Gemini Live: one short session that reads the sentence
    toast('Connecting to Gemini Live…');
    const ws = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(o.key)}`);
    const fake = { outCtx: ctx, nextTime: 0, sources: [] }; let ok = false;
    const kill = setTimeout(() => { try { ws.close(); } catch (e) { } if (!ok) toast('Gemini Live did not answer: try engine B', 'warn'); }, 15000);
    ws.onopen = () => ws.send(JSON.stringify({ setup: { model: 'models/' + o.live, generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: o.voice } } } }, systemInstruction: { parts: [{ text: `You are a friendly Egyptian receptionist. Speak only Egyptian Arabic with a Cairo accent. When asked, read the given sentence exactly, naturally.` }] } } }));
    ws.onmessage = async (ev) => { const m = JSON.parse(typeof ev.data === 'string' ? ev.data : await ev.data.text());
      if (m.setupComplete) { ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text: 'اقرا الجملة دي بالظبط بلهجة مصرية: ' + text }] }], turnComplete: true } })); return; }
      const parts = m.serverContent?.modelTurn?.parts || []; parts.forEach((p) => { if (p.inlineData?.data) { ok = true; playPcm(fake, p.inlineData.data, p.inlineData.mimeType); } });
      if (m.serverContent?.turnComplete) { clearTimeout(kill); setTimeout(() => ws.close(), 500); } };
    ws.onclose = (e) => { if (!ok) toast('Gemini Live closed: ' + (e.reason || e.code) + '. Try engine B.', 'warn'); };
  } catch (e) { toast('Voice test failed: ' + String(e.message || e).slice(0, 100), 'warn'); }
}
